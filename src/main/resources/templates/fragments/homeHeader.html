<!-- homeHeader.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<div th:fragment="homeHeader">
    <nav class="navbar navbar-light bg-white border-bottom px-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- ✅ 왼쪽 로고 영역 -->
            <a href="/" class="navbar-brand fw-bold text-dark fs-4">BookShop</a>

            <!-- 오른쪽 로그인 / 사용자 메뉴 -->
            <div sec:authorize="isAnonymous()"> <!-- ✅ [수정된 부분] 세션 조건 제거 -->
                <a class="nav-link text-primary" href="/members/new">회원가입</a>
                <a class="nav-link text-primary" href="/loginPage">로그인</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                <div sec:authorize="hasRole('ADMIN')"> <!-- ✅ [수정된 부분] -->
                    <a class="nav-link text-danger fw-bold" href="/admin">관리자 메뉴</a>
                </div>

                <a class="nav-link text-primary" href="/orders">내 주문</a>
                <!-- ✅ [수정] 환영 메시지: 인증된 사용자 정보 출력 -->
                <!-- 기본적으로 #authentication.name 은 "username" 또는 principal의 name을 의미합니다. -->
                <span class="text-success fw-bold"
                      th:text="'환영합니다, ' + ${#authentication.name} + '님'">
                </span>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">로그아웃</button>
                </form>
            </div>

        </div>
    </nav>
</div>
</html>
